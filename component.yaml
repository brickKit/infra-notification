apiVersion: brickkit/v1
kind: Component

metadata:
  id: infra/notification
  name: Notifications
  version: 2.0.0
  description: "Takes notification intents from business components and routes them to the installed channel adapters by each user's preferences."
  repository: https://github.com/brickKit/infra-notification
  license: Apache-2.0
  vendor: brickKit

tags: [infra, notification, dispatch]

artifacts:
  - type: api-contract
    format: protobuf
    files: [contracts/infra/notification/v1/notification.proto, contracts/events/notification.events.json]
  - type: api-contract
    format: openapi
    files: [contracts/notification.openapi.yaml]
  - type: metadata
    files: [assembly.yaml]

dependencies:
  components: []

configSchema:
  type: object
  properties:
    PG_HOST: {type: string}
    PG_PORT: {type: string, default: "5432"}
    PG_DATABASE: {type: string}
    PG_USER: {type: string}
    PG_PASSWORD: {type: string, secret: true}
    PG_SCHEMA: {type: string, default: infra_notification}
    NATS_URL: {type: string}
    OTEL_BASE_URL: {type: string, default: ""}
    AUTHZ_BUNDLE_URL: {type: string}
    IAM_JWKS_URL: {type: string}
    IM_TARGET_ADAPTERS: {type: string, default: dingtalk}
  required: [PG_HOST, PG_DATABASE, PG_USER, PG_PASSWORD, NATS_URL, AUTHZ_BUNDLE_URL, IAM_JWKS_URL]

deployment:
  type: container
  build: {context: ., dockerfile: Dockerfile}
  port: 8202
  extraPorts:
    - {name: grpc, port: 9202}
  labels:
    prometheus.io/scrape: "true"
    prometheus.io/path: /metrics
  resources:
    requests: {cpu: 150m, memory: 192Mi}

migration:
  command: [./migrate, up]

healthCheck:
  type: http
  path: /healthz

local:
  language: go
  runCommand: [go, run, ./backend/cmd/server]
